name: hotpath ingest_rules_logs

# hotpath-cloud (https://hotpath.rs/ci_integration): runs one Criterion id of
# ingest_rules_bench a fixed number of times, natively and under Callgrind, and
# merges both into one report. Pushes to main upload the baseline; pull requests
# store the report as an artifact that hotpath-relay.yml uploads, so pull
# requests from forks get a comment too.
on:
    push:
        branches: [main]
        paths:
            - "apps/ingest/**"
            - "hotpath/**"
            - ".github/workflows/hotpath-ingest-rules-logs.yml"
    pull_request:
        paths:
            - "apps/ingest/**"
            - "hotpath/**"
            - ".github/workflows/hotpath-ingest-rules-logs.yml"

jobs:
    upload:
        name: benchmark (push)
        if: github.event_name == 'push'
        # Instruction counts only compare within one Valgrind build and Rust
        # toolchain, so the image, the package and the toolchain are pinned.
        runs-on: ubuntu-26.04
        # A cold cache compiles the whole crate graph in release.
        timeout-minutes: 45
        permissions:
            contents: read
            id-token: write # the upload authenticates with the job's OIDC token
        # Shared by both runs, so their reports describe one benchmark.
        env:
            CARGO_TERM_COLOR: never
            HOTPATH_BENCHMARK: ingest_rules_logs
            HOTPATH_CRITERION_ITERATIONS: "10000"
            HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.94.1,profile=release,valgrind=3.26.0
            HOTPATH_OUTPUT_FORMAT: json
            # The bench builds in the nested apps/ingest workspace but runs from the
            # repository root, so hotpath cannot derive the source links' prefix.
            HOTPATH_SOURCE_ROOT: apps/ingest
            CRITERION_ID: ingest_rules_logs_10_records/five_rules_with_detectors
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: "1.94.1"

            - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
              with:
                  workspaces: apps/ingest

            - name: Install valgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
                  valgrind --version

            # The bench binary's file name carries a hash, so take it from Cargo's output.
            - name: Build benchmark
              id: build
              working-directory: apps/ingest
              run: |
                  bin=$(cargo build -q --locked --release --bench ingest_rules_bench \
                    --features hotpath-alloc,hotpath-cloud,hotpath-callgrind --message-format=json \
                    | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | index("bench"))) | .executable')
                  test -x "$bin"
                  echo "bin=$bin" >> "$GITHUB_OUTPUT"

            # Both runs start from the repository root, where hotpath/ holds the policy.
            - name: Run benchmark natively
              env:
                  BIN: ${{ steps.build.outputs.bin }}
                  HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
              run: |
                  "$BIN" --bench --test --exact "$CRITERION_ID"

            - name: Run benchmark under Callgrind and upload the merged report
              env:
                  BIN: ${{ steps.build.outputs.bin }}
                  HOTPATH_UPLOAD: fail-on-error
                  HOTPATH_UPLOAD_RESPONSE_PATH: ${{ github.workspace }}/upload.json
                  HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/merged.json
                  HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
                  HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
              run: |
                  valgrind -q --tool=callgrind --instr-atstart=no \
                    --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
                    "$BIN" --bench --test --exact "$CRITERION_ID"
                  test -s "$HOTPATH_UPLOAD_RESPONSE_PATH"
                  jq -e --arg id "$CRITERION_ID" '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and .user_metadata.criterion_benchmark == $id' \
                    "$HOTPATH_OUTPUT_PATH" > /dev/null

    report:
        name: benchmark (pull request)
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        # Runs the pull request's code, possibly from a fork: no upload token.
        permissions:
            contents: read
        env:
            CARGO_TERM_COLOR: never
            HOTPATH_BENCHMARK: ingest_rules_logs
            HOTPATH_CRITERION_ITERATIONS: "10000"
            HOTPATH_USER_METADATA: runner=Linux-X64,toolchain=1.94.1,profile=release,valgrind=3.26.0
            HOTPATH_OUTPUT_FORMAT: json
            # The bench builds in the nested apps/ingest workspace but runs from the
            # repository root, so hotpath cannot derive the source links' prefix.
            HOTPATH_SOURCE_ROOT: apps/ingest
            CRITERION_ID: ingest_rules_logs_10_records/five_rules_with_detectors
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  # The pull request's head commit, not the default merge commit.
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
              with:
                  toolchain: "1.94.1"

            - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
              with:
                  workspaces: apps/ingest

            - name: Install valgrind
              run: |
                  sudo apt-get update
                  sudo apt-get install -y valgrind=1:3.26.0-0ubuntu1
                  valgrind --version

            - name: Build benchmark
              id: build
              working-directory: apps/ingest
              run: |
                  bin=$(cargo build -q --locked --release --bench ingest_rules_bench \
                    --features hotpath-alloc,hotpath-cloud,hotpath-callgrind --message-format=json \
                    | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | index("bench"))) | .executable')
                  test -x "$bin"
                  echo "bin=$bin" >> "$GITHUB_OUTPUT"

            - name: Run benchmark natively
              env:
                  BIN: ${{ steps.build.outputs.bin }}
                  HOTPATH_OUTPUT_PATH: ${{ runner.temp }}/native.json
              run: |
                  "$BIN" --bench --test --exact "$CRITERION_ID"

            - name: Run benchmark under Callgrind and write the merged report
              env:
                  BIN: ${{ steps.build.outputs.bin }}
                  HOTPATH_OUTPUT_PATH: report.json
                  HOTPATH_MERGE_REPORT: ${{ runner.temp }}/native.json
                  HOTPATH_CALLGRIND_OUT_FILE: ${{ runner.temp }}/callgrind.out.%p
              run: |
                  valgrind -q --tool=callgrind --instr-atstart=no \
                    --callgrind-out-file="$HOTPATH_CALLGRIND_OUT_FILE" \
                    "$BIN" --bench --test --exact "$CRITERION_ID"
                  test -s report.json
                  jq -e --arg id "$CRITERION_ID" '.meta.run == "merged" and (.functions_icount.data | length > 0) and (.functions_timing.data | length > 0) and .user_metadata.criterion_benchmark == $id' \
                    report.json > /dev/null

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: hotpath-report
                  path: report.json
                  retention-days: 1
                  if-no-files-found: error

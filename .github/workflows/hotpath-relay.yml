name: hotpath relay

# Uploads the report a hotpath-ingest-rules-*.yml pull request run stored as an
# artifact (https://hotpath.rs/ci_integration#pull-requests-from-forks). Those runs
# may execute fork code, so they get no upload token; this job does, and never
# checks out or runs pull request code. It runs from the default branch's copy of
# this file, and matches the benchmark workflows by their `name:`.
on:
    workflow_run:
        workflows: ["hotpath ingest_rules_traces", "hotpath ingest_rules_logs"]
        types: [completed]

permissions: {} # jobs get only what they declare

jobs:
    relay:
        # only successful pull request runs have a report; the action checks this too
        if: >-
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read # download the artifact of the benchmark run
            id-token: write # authenticate the upload
            pull-requests: read # find the pull request the run belongs to
        concurrency: # a newer run of the same benchmark and branch supersedes an older one
            group: hotpath-relay-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
            cancel-in-progress: true
        steps:
            - uses: hotpath-rs/hotpath-relay@v1.0.0
              with:
                  # benchmark workflow `name:` -> its `HOTPATH_BENCHMARK`
                  benchmark: ${{ fromJSON('{"hotpath ingest_rules_traces":"ingest_rules_traces","hotpath ingest_rules_logs":"ingest_rules_logs"}')[github.event.workflow_run.name] }}
                  # Both benchmarks build in the nested apps/ingest Cargo workspace.
                  source_root: apps/ingest
